<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | MTFOA{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@400;600;700&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #f4f6fa; }
  body { font-family: 'Barlow', Arial, Helvetica, sans-serif; }
  main { display: block; }
  /* The footer embed's own root is deliberately transparent (see footer.html's
     header comment) — on WebsiteBuilder the navy fill came from the page
     section it sat in. This reproduces that section here. */
  .site-footer-section { background: #142a4d; border-top: 4px solid #d6291a; }
</style>
</head>
<body>
{% include nav.html %}
<main>
{{ content }}
</main>
<div class="site-footer-section">
{% include footer.html %}
</div>
</body>
</html>
