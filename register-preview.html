<!-- ============================================================
     MTFOA season registration (will replace the embedded Google Form on /register at go-live:
     move this file to register.html and change the permalink to /register).
     One question group per screen, saved as you go. Sends everything to the Roster
     Apps Script ("register" action), which stores it on the Registrations tab and
     opens a Stripe Checkout page. Card and bank details are typed on Stripe's page
     only - they never touch mtfoa.org or the Apps Script.
     Returning members sign in first (same sign-in as the Member Portal) so their
     details are prefilled from last season.
   ============================================================ -->

<div class="rg-hero">
  <div class="rg-eyebrow">Middle Tennessee Football Officials Association</div>
  <h1 id="rgTitle">Registration</h1>
</div>
<div class="rg-card" id="rgCard" aria-live="polite">
  <noscript><p class="rg-msg">This form needs JavaScript. Please turn it on, or try a different browser.</p></noscript>
  <div class="wait"><span class="spin"></span>Loading&hellip;</div>
</div>

<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbzrUU5NYuD3X_3ljgA92e_hnMJNs8efwNYwTzttqO7-dy7v2uvZnG4Iu5NjPcr36nkw/exec';
  var PASS = 'mtfoa_pass', DRAFT = 'mtfoa_reg_draft';
  var POS = [{ k: 'Referee' }, { k: 'Umpire' }, { k: 'Head Linesman', n: 'includes deep wing' }, { k: 'Line Judge', n: 'includes deep wing' }, { k: 'Back Judge' }];
  var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var STATES = 'AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split(' ');
  var TIMES = (function () { var o = []; for (var m = 8 * 60; m <= 21 * 60; m += 30) { var h = Math.floor(m / 60), mm = m % 60; o.push(((h + 11) % 12 + 1) + ':' + (mm < 10 ? '0' : '') + mm + ' ' + (h < 12 ? 'AM' : 'PM')); } return o; })();

  var ROUNDS = ['First round', 'Second round', 'Quarterfinals', 'Semifinals', 'Championship game'];

  var card = document.getElementById('rgCard');
  var S = { step: 'wait', kind: '', experienced: null, token: '', user: null, season: '', fee: 12000, open: true, source: '', f: blank(), errs: {}, msg: '', banner: '', bannerAt: '', bannerWarn: false, busy: false, restored: false, agree: false, setup: null };

  function blank() {
    return { interest: '', first: '', last: '', email: '', mobile: '', home: '', work: '', prefPhone: 'Mobile', more: false, street: '', city: '', state: 'TN', zip: '',
      emName: '', emPhone: '', yearsWith: '', worked: [], prefPositions: [], days: [], time: '', postseason: '', finals: '', scratches: '', pl: [], plNote: '', plOlder: '',
      howHeard: '', priorAssoc: '', priorYears: '' };
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel) { return card.querySelector(sel); }
  function money(c) { return '$' + (c / 100).toFixed(2); }
  function empty(v) { return Array.isArray(v) ? !v.length : !String(v == null ? '' : v).trim(); }

  /* ---------- the Member Portal sign-in (same storage the portal uses) ---------- */
  function readPass() {
    try { var raw = localStorage.getItem(PASS) || sessionStorage.getItem(PASS); var o = raw && JSON.parse(raw); return o && o.t && o.x > Date.now() ? o.t : ''; } catch (e) { return ''; }
  }
  function savePass(token, hours, keep) {
    try { var v = JSON.stringify({ t: token, x: Date.now() + hours * 3600 * 1000 }); localStorage.removeItem(PASS); sessionStorage.removeItem(PASS); (keep ? localStorage : sessionStorage).setItem(PASS, v); } catch (e) {}
  }
  function clearPass() { try { localStorage.removeItem(PASS); sessionStorage.removeItem(PASS); sessionStorage.removeItem('mtfoa_me'); } catch (e) {} }
  function call(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).catch(function () { return { status: 'error', code: 'net', message: 'We could not reach the server. Please check your connection and try again.' }; });
  }

  /* ---------- progress saved on this device (never the password or card details) ---------- */
  var saveTimer = 0;
  function saveDraft() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { if (S.step === 'wait' || S.step === 'done' || S.step === 'already' || S.step === 'closed') return;
        localStorage.setItem(DRAFT, JSON.stringify({ t: Date.now(), kind: S.kind, experienced: S.experienced, step: S.step, f: S.f })); } catch (e) {}
    }, 250);
  }
  function loadDraft() {
    try { var d = JSON.parse(localStorage.getItem(DRAFT) || 'null'); if (d && d.t > Date.now() - 14 * 86400000 && d.f) return d; } catch (e) {}
    return null;
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT); } catch (e) {} }

  /* ---------- which screens apply to this person ---------- */
  function steps() {
    var s = ['interest', 'you', 'address', 'exp', 'avail', 'extras', 'review'];
    return s;
  }
  function flagOnly() { return S.f.interest === 'Flag'; }
  function newNoExp() { return S.kind === 'new' && S.experienced === false; }
  /* ---------- playoff experience: one line per season (season + highest round), saved as text in the same sheet column ---------- */
  function plYears() { var y0 = new Date().getFullYear(), a = []; for (var i = 0; i < 5; i++) a.push(String(y0 - i)); return a; }   /* the last five seasons */
  function plDone(r) { return !!(r && r.y && r.r); }
  function syncPl() {
    var parts = S.f.pl.filter(plDone).sort(function (a, b) { return Number(b.y) - Number(a.y); }).map(function (r) { return r.y + ' \u2013 ' + r.r; });
    if (String(S.f.plOlder || '').trim()) parts.push('Older state championships: ' + String(S.f.plOlder).trim());
    if (String(S.f.plNote || '').trim()) parts.push(String(S.f.plNote).trim());
    S.f.postseason = parts.join('; ');
    S.plInit = true;
  }
  function initPl() {   /* answers from an earlier registration were free text: turn the "year - round" ones back into lines and keep the rest as a note */
    if (S.plInit) return; S.plInit = true;
    if (S.f.pl.length || !String(S.f.postseason || '').trim() && !String(S.f.finals || '').trim()) return;
    var left = [], yrs = plYears();
    String(S.f.postseason || '').split(/;\s*/).forEach(function (tok) {
      var m = tok.match(/^(\d{4}) \u2013 (.+)$/), o = tok.match(/^Older state championships: (.+)$/);
      if (m && ROUNDS.indexOf(m[2]) >= 0 && yrs.indexOf(m[1]) >= 0 && !S.f.pl.some(function (r) { return r.y === m[1]; })) S.f.pl.push({ y: m[1], r: m[2] });
      else if (o) S.f.plOlder = o[1].trim();
      else if (tok.trim()) left.push(tok.trim());
    });
    if (S.kind === 'returning' && String(S.f.finals || '').trim()) left.push('State finals worked: ' + String(S.f.finals).trim());
    S.f.plNote = left.join('; ');
    syncPl();
  }
  function plBlock() {
    var yrs = plYears(), oldest = yrs[yrs.length - 1];
    var rows = S.f.pl.map(function (r, i) {
      return '<div class="plrow"><select data-pl="y" data-i="' + i + '" aria-label="Season"><option value="">Season&hellip;</option>' + yrs.map(function (y) { var taken = S.f.pl.some(function (o, k) { return k !== i && o.y === y; }); return '<option' + (r.y === y ? ' selected' : '') + (taken ? ' disabled' : '') + '>' + y + '</option>'; }).join('') + '</select>' +
        '<select data-pl="r" data-i="' + i + '" aria-label="Highest round worked"><option value="">Highest round&hellip;</option>' + ROUNDS.map(function (x) { return '<option' + (r.r === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
        '<button type="button" class="rg-link" data-act="pldel" data-i="' + i + '" aria-label="Remove this season">Remove</button></div>';
    }).join('');
    return '<div class="fld' + (S.errs.pl ? ' bad' : '') + '"><label>Playoff experience <span class="opt">(optional)</span></label>' +
      '<p class="hint" style="margin:0 0 10px">Add a line for each of your last five seasons (' + oldest + ' to ' + yrs[0] + ') that you worked the playoffs, in any state. Skip this if you have none.</p>' + rows +
      (S.f.pl.length < yrs.length ? '<button type="button" class="rg-link more" data-act="pladd" style="margin:2px 0 0">+ Add a season</button>' : '<p class="hint" style="margin:2px 0 0">That is all five seasons.</p>') + errLine('pl') +
      '<div class="fld" style="margin-top:16px"><label for="f_plOlder">State championship games before ' + oldest + ' <span class="opt">(optional)</span></label><input type="text" id="f_plOlder" data-f="plOlder" maxlength="120" autocomplete="off" value="' + esc(S.f.plOlder) + '" placeholder="For example, 2018, 2015"><p class="hint">If you worked a state championship game more than five years ago, list the year or years.</p></div>' +

    return '<div class="done"><div class="big">' + ICON.check + '</div><h2 tabindex="-1">You are registered. Thank you!</h2><p class="rg-lead">Your payment went through and you have been added to the roster as a Reserve. A confirmation email is on its way (check your spam folder). Please finish these steps:</p></div>' + s1 + s2 + s3;
  }
  function suErr(msg) { var er = card.querySelector('#suErr'); if (!er) return; er.textContent = msg || ''; er.hidden = !msg; }
  function doSendCode() {
    var u = S.setup; if (!u || u.busy) return;
    u.busy = true; u.err = ''; suErr('');
    card.querySelectorAll('[data-act=sendcode]').forEach(function (b) { b.disabled = true; });
    call({ action: 'requestcode', email: u.email }).then(function (r) {
      u.busy = false;
      if (r.status === 'ok') { u.phase = 'code'; render(false); var c = card.querySelector('#suCode'); if (c) c.focus(); }
      else { u.err = r.message || 'We could not send the code. Please try again in a moment.'; render(false); }
    });
  }
  function doSavePw() {
    var u = S.setup; if (!u || u.busy) return;
    var code = (card.querySelector('#suCode') || {}).value || '', pw = (card.querySelector('#suPw') || {}).value || '', keep = !!(card.querySelector('#suKeep') || {}).checked;
    code = code.replace(/\s+/g, '');
    if (!/^\d{4,8}$/.test(code)) { suErr('Please type the 6-digit code from the email.'); return; }
    if (pw.length < 8) { suErr('Please choose a password of at least 8 characters.'); return; }
    u.busy = true; suErr('');
    var btn = card.querySelector('[data-act=savepw]'); if (btn) { btn.disabled = true; btn.textContent = 'Saving\u2026'; }
    call({ action: 'setpassword', email: u.email, code: code, password: pw, remember: keep }).then(function (r) {
      u.busy = false;
      if (r.status === 'ok' && r.token) { savePass(r.token, r.hours || 12, keep); u.phase = 'done'; u.err = ''; render(); }
      else { if (btn) { btn.disabled = false; btn.textContent = 'Save my password'; } suErr(r.message || 'That did not work. Please check the code and try again.'); }
    });
  }
  function confirmPaid(sid) {
    S.step = 'confirm'; render(false);
    var tries = 0;
    (function ask() {
      call({ action: 'regconfirm', session: sid }).then(function (r) {
        tries++;
        if (r.status === 'ok' && r.paid) {
          if (r.isNew && r.email) S.setup = { email: r.email, first: r.first || '', ready: !!r.ready, phase: 'start', err: '', busy: false };
          S.step = 'done'; render(); return;
        }
        if (tries < 8 && (r.status === 'ok' || r.code === 'net' || r.code === 'stripe')) { setTimeout(ask, 2500); return; }
        S.step = 'done'; render();
      });
    })();
  }
  function nextSteps() {
    return '<div class="next"><h3 style="margin-top:12px">What to do next</h3><ol>' +
      '<li><b>Create your Member Portal password</b> if you have not already (meeting attendance, resources, nominations). <a href="/mtfoamembers">Open the Member Portal</a></li>' +
      '<li><b>When TSSAA registration is open, register with the TSSAA on Arbiter.</b> <a href="/tssaa-registration">Step-by-step guide</a></li></ol></div>';
  }

  /* ---------- rendering and events ---------- */
  function render(focus) {
    card.innerHTML = view();
    var t = document.getElementById('rgTitle'); if (t) t.textContent = S.season ? S.season + ' Registration' : 'Registration';
    if (focus !== false) { var h = card.querySelector('h2'); if (h) { try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } card.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); } }
    saveDraft();
  }
  function go(step) { S.step = step; S.errs = {}; S.msg = ''; render(); }
  function goNext() { var l = steps(), i = l.indexOf(S.step); go(l[Math.min(i + 1, l.length - 1)]); }
  function goBack() {
    var l = steps(), i = l.indexOf(S.step);
    if (S.step === 'signin') return go('start');
    if (S.step === 'interest') return go(S.kind === 'returning' && !S.user ? 'signin' : 'start');
    go(l[Math.max(i - 1, 0)]);
  }

  card.addEventListener('input', function (e) {
    var el = e.target, k = el.getAttribute('data-f');
    if (!k) return;
    S.f[k] = el.value;
    if (k === 'plNote' || k === 'plOlder') syncPl();
    if (S.errs[k]) { delete S.errs[k]; var box = el.closest('.fld'); if (box) { box.classList.remove('bad'); var er = box.querySelector('.err'); if (er) er.remove(); } }
    saveDraft();
  });
  card.addEventListener('change', function (e) {
    var el = e.target, k = el.getAttribute('data-f');
    if (el.getAttribute('data-pl')) { var row = S.f.pl[Number(el.getAttribute('data-i'))]; if (row) { row[el.getAttribute('data-pl')] = el.value; delete S.errs.pl; var eb = card.querySelector('.fld.bad'); if (eb && !S.errs.pl) { eb.classList.remove('bad'); var ee = eb.querySelector('.err'); if (ee) ee.remove(); } syncPl(); saveDraft(); var mm = card.querySelector('.rg-msg'); if (mm && !Object.keys(S.errs).length) { mm.remove(); S.msg = ''; } } return; }
    if (el.id === 'rgAgree') { S.agree = !!el.checked; if (S.agree) { delete S.errs.agree; var ab = el.closest('.agree'); if (ab) { ab.classList.remove('bad'); var ae = ab.querySelector('.err'); if (ae) ae.remove(); } } return; }
    if (k && (k === 'mobile' || k === 'home' || k === 'work' || k === 'emPhone')) { var p = fmtPhone(el.value); if (p) { el.value = p; S.f[k] = p; saveDraft(); } }
    if (k === 'home' || k === 'work') { if (!S.f.home && S.f.prefPhone === 'Home') S.f.prefPhone = 'Mobile'; if (!S.f.work && S.f.prefPhone === 'Work') S.f.prefPhone = 'Mobile'; }
  });
  function fmtPhone(v) { var d = String(v).replace(/\D/g, ''); if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1); return d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : ''; }

  card.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || !card.contains(b)) return;
    var act = b.getAttribute('data-act'), k = b.getAttribute('data-f'), v = b.getAttribute('data-v');
    if (act === 'pick') { S.f[k] = v; delete S.errs[k]; card.querySelectorAll('[data-act=pick][data-f=' + k + ']').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); var er = card.querySelector('.err'); if (er && k === 'interest') er.remove(); saveDraft(); }
    else if (act === 'toggle') { var a = S.f[k], i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); b.setAttribute('aria-pressed', i < 0 ? 'true' : 'false'); delete S.errs[k]; saveDraft(); }
    else if (act === 'days') { S.f.days = v === 'all' ? DAYS.slice() : v === 'wk' ? DAYS.slice(0, 5) : []; delete S.errs.days; render(false); }
    else if (act === 'kind') { S.kind = v; card.querySelectorAll('[data-act=kind]').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); S.msg = ''; var m1 = card.querySelector('.rg-msg'); if (m1) m1.remove(); }
    else if (act === 'exp') { S.experienced = v === 'yes'; delete S.errs.experienced; render(false); }
    else if (act === 'more') { S.f.more = true; render(false); }
    else if (act === 'sendcode') doSendCode();
    else if (act === 'savepw') doSavePw();
    else if (act === 'photo') { window.location.href = '/members#myphoto'; }
    else if (act === 'pladd') { if (S.f.pl.length >= plYears().length) return; S.f.pl.push({ y: '', r: '' }); delete S.errs.pl; syncPl(); render(false); var sel = card.querySelectorAll('.plrow select[data-pl=y]'); if (sel.length) sel[sel.length - 1].focus(); }
    else if (act === 'pldel') { S.f.pl.splice(Number(b.getAttribute('data-i')), 1); delete S.errs.pl; syncPl(); render(false); }
    else if (act === 'goto') go(v);
    else if (act === 'back') goBack();
    else if (act === 'signout') { clearPass(); S.plInit = false; S.user = null; S.token = ''; S.kind = ''; S.f = blank(); S.banner = ''; go('start'); }
    else if (act === 'restart') { clearDraft(); S.agree = false; S.plInit = false; S.f = blank(); S.kind = S.user ? 'returning' : ''; S.experienced = null; S.banner = ''; go(S.user ? 'interest' : 'start'); }
    else if (act === 'next') onNext();
  });
  card.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); onNext(); } });

  function onNext() {
    if (S.busy) return;
    switch (S.step) {
      case 'start':
        if (!S.kind) { S.msg = 'Please choose one of the two options above.'; render(false); return; }
        S.msg = '';
        if (S.kind === 'new') { S.user = null; return go('interest'); }
        if (S.token) return loadPrefill(); return go('signin');
      case 'signin': return doSignIn();
      case 'review': return doPay();
      case 'done': if (S.setup && S.setup.phase === 'code') doSavePw(); return;
      case 'confirm': return;
      default:
        var errs = check(S.step);
        if (Object.keys(errs).length) { S.errs = errs; S.msg = 'Please fix the highlighted items.'; render(false); var first = card.querySelector('.fld.bad input, .fld.bad select, .fld.bad textarea'); if (first) first.focus(); else { var er = card.querySelector('.err'); if (er) er.scrollIntoView({ block: 'center' }); } return; }
        goNext();
    }
  }

  /* ---------- checking each screen (the server checks again) ---------- */
  function check(step) {
    var f = S.f, e = {};
    if (step === 'interest' && !f.interest) e.interest = 'Please choose tackle, flag, or both.';
    if (step === 'you') {
      if (!f.first.trim()) e.first = 'Required'; if (!f.last.trim()) e.last = 'Required';
      if (S.kind === 'new' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) e.email = 'Please enter a valid email address.';
      if (!fmtPhone(f.mobile)) e.mobile = 'Please enter a 10-digit phone number.';
      if (f.home.trim() && !fmtPhone(f.home)) e.home = 'Needs 10 digits, or leave blank.';
      if (f.work.trim() && !fmtPhone(f.work)) e.work = 'Needs 10 digits, or leave blank.';
    }
    if (step === 'address') {
      if (!f.street.trim()) e.street = 'Required'; if (!f.city.trim()) e.city = 'Required';
      if (!/^\d{5}(-\d{4})?$/.test(f.zip.trim())) e.zip = 'Please enter a 5-digit ZIP.';
      if (!f.emName.trim()) e.emName = 'Required';
      if (!fmtPhone(f.emPhone)) e.emPhone = 'Please enter a 10-digit phone number.';
    }
    if (step === 'exp') {
      if (S.kind === 'returning') { if (!f.yearsWith) e.yearsWith = 'Please choose one.'; }
      else {
        if (!f.howHeard.trim()) e.howHeard = 'Required';
        if (S.experienced === null) e.experienced = 'Please choose one.';
        if (S.experienced === true) { if (!f.priorAssoc.trim()) e.priorAssoc = 'Required'; if (!f.priorYears.trim()) e.priorYears = 'Required'; }
      }
    }
    if (step === 'extras' && showPlayoffs() && S.f.pl.some(function (r) { return !plDone(r); })) e.pl = 'Please choose both a season and a round on each line, or remove the line.';
    if (step === 'avail') {
      if (!flagOnly() && !f.prefPositions.length) e.prefPositions = 'Please choose at least one position.';
      if (!f.days.length) e.days = 'Please choose at least one day.';
      if (!f.time) e.time = 'Please choose a time.';
    }
    return e;
  }

  /* ---------- talking to the server ---------- */
  function doSignIn() {
    var em = $('#siEmail').value.trim(), pw = $('#siPass').value, keep = $('#siKeep').checked;
    S.f.email = em;
    if (!em || !pw) { S.msg = 'Please type your email and your password.'; render(false); return; }
    S.busy = true; S.msg = ''; render(false);
    var slow = setTimeout(function () { if (S.busy && S.step === 'signin') { S.banner = 'Still signing you in &mdash; this can take a little while the first time.'; S.bannerAt = 'signin'; render(false); } }, 9000);
    call({ action: 'signin', email: em, password: pw, remember: keep }).then(function (r) {
      clearTimeout(slow); S.banner = ''; S.busy = false;
      if (r.status !== 'ok') { S.msg = r.message || 'That did not work. Please check your email and password.'; render(false); return; }
      savePass(r.token, r.hours || 12, keep); S.token = r.token; S.user = r.user || { email: em };
      loadPrefill();
    });
  }
  function applyFields(fields) {
    if (!fields) return;
    Object.keys(fields).forEach(function (k) { if (k in S.f && empty(S.f[k]) && !empty(fields[k])) S.f[k] = fields[k]; });
    if (S.f.home || S.f.work) S.f.more = true;
  }
  function loadPrefill() {
    S.step = 'wait'; render(false);
    call({ action: 'regprefill', token: S.token }).then(function (r) {
      if (r.status !== 'ok') { clearPass(); S.token = ''; S.user = null; S.msg = r.code === 'auth' ? 'Your sign-in expired. Please sign in again.' : (r.message || 'Please sign in again.'); S.step = 'signin'; render(false); return; }
      S.kind = 'returning'; S.user = S.user || {}; S.user.email = S.user.email || (r.fields && r.fields.email) || ''; S.user.name = r.name || S.user.name || '';
      if (r.paid) { clearDraft(); S.step = 'already'; render(); return; }
      var em = (S.user.email || '').toLowerCase(); S.f.email = em || S.f.email;
      applyFields(r.fields);
      if (empty(S.f.first) && r.name) { var p = String(r.name).trim().split(/\s+/); S.f.first = p.shift() || ''; S.f.last = p.join(' '); }
      S.banner = r.fields ? 'We filled in what we have from your ' + esc(r.source || 'last registration') + '. Please check each screen and fix anything that has changed.' : ''; S.bannerAt = 'interest';
      go('interest');
    });
  }
  function payload() {
    if (showPlayoffs()) { initPl(); syncPl(); }
    var f = S.f, b = {};
    Object.keys(f).forEach(function (k) { b[k] = f[k]; });
    b.action = 'register'; b.experienced = S.kind === 'new' && S.experienced === true; b.page = location.pathname.replace(/\/+$/, '');
    if (flagOnly()) b.prefPositions = [];
    b.agree = S.agree === true;
    if (!showPlayoffs()) b.postseason = '';
    b.finals = S.kind === 'returning' ? S.f.pl.filter(function (r) { return plDone(r) && r.r === 'Championship game'; }).map(function (r) { return r.y; }).concat(String(S.f.plOlder || '').trim() ? [String(S.f.plOlder).trim()] : []).join(', ') : '';   /* state finals worked = the seasons with a championship game, plus any older ones */
    delete b.pl; delete b.plNote; delete b.plOlder;
    if (S.kind === 'returning') b.token = S.token; else delete b.token;
    return b;
  }
  function doPay() {
    var order = ['interest', 'you', 'address', 'exp', 'avail', 'extras'];
    for (var i = 0; i < order.length; i++) { var e = check(order[i]); if (Object.keys(e).length) { S.errs = e; S.msg = 'One of your answers needs attention.'; go(order[i]); S.errs = e; S.msg = 'One of your answers needs attention.'; render(false); return; } }
    if (!S.agree) { S.errs = { agree: 'Please check the box to confirm the agreement before you pay.' }; S.msg = ''; render(false); var ag = card.querySelector('.agree'); if (ag) ag.scrollIntoView({ block: 'center' }); return; }
    S.busy = true; S.msg = ''; render(false); saveDraft();
    var slow = setTimeout(function () { if (S.busy && S.step === 'review') { S.banner = 'Still working &mdash; please do not close this page. This can take up to a minute.'; S.bannerAt = 'review'; S.bannerWarn = false; render(false); } }, 9000);
    call(payload()).then(function (r) {
      clearTimeout(slow); S.banner = ''; S.busy = false;
      if (r.status === 'ok' && r.url) { window.location.href = r.url; S.busy = true; return; }
      if (r.code === 'already') { clearDraft(); S.step = 'already'; render(); return; }
      if (r.code === 'signin') { S.kind = 'returning'; S.msg = r.message; S.step = 'signin'; render(); return; }
      if (r.code === 'auth') { clearPass(); S.token = ''; S.user = null; S.msg = r.message; S.step = 'signin'; render(); return; }
      S.msg = r.message || 'Something went wrong. Please try again.'; render(false);
    });
  }

  /* ---------- start up ---------- */
  function start() {
    var q = new URLSearchParams(location.search);
    var tok0 = readPass();   // signed-in? ask for the prefill and the profile at the same time as the settings, not one after another
    var pPre = tok0 ? call({ action: 'regprefill', token: tok0 }) : null, pMe = tok0 ? call({ action: 'me', token: tok0 }) : null;
    call({ action: 'reginfo' }).then(function (r) {
      if (r.status === 'ok') { S.season = r.season; S.fee = r.feeCents; S.open = r.open; }
      else { S.season = ''; }
      S.token = readPass();
      if (q.get('paid') === '1') { clearDraft(); if (q.get('s')) return confirmPaid(q.get('s')); S.step = 'done'; return render(); }
      if (!S.open) { S.step = 'closed'; return render(); }
      var d = loadDraft();
      if (d) { S.f = Object.assign(blank(), d.f); S.kind = d.kind || ''; S.experienced = d.experienced; S.restored = true; }
      var canceled = q.get('canceled') === '1' && d;
      if (canceled) { S.banner = 'Your payment was not completed and <b>you have not been charged</b>. Your answers are saved &mdash; continue when you are ready.'; S.bannerWarn = true; S.bannerAt = 'review'; }
      else if (d) { S.banner = 'Welcome back &mdash; we saved your progress. <button type="button" class="rg-link" data-act="restart">Start over</button>'; S.bannerAt = d.step || 'start'; }
      if (S.token) {
        S.kind = 'returning';
        S.step = 'wait'; render(false);
        (pPre || call({ action: 'regprefill', token: S.token })).then(function (p) {
          if (p.status !== 'ok') { clearPass(); S.token = ''; S.user = null; S.kind = d && d.kind === 'new' ? 'new' : ''; S.step = S.kind ? (d.step || 'interest') : 'start'; return render(false); }
          S.user = { email: (S.f.email || ''), name: p.name || '' };
          (pMe || call({ action: 'me', token: S.token })).then(function (m) { if (m && m.status === 'ok' && m.user) { S.user.email = m.user.email; S.user.name = m.user.name; S.f.email = m.user.email; } finish(p, d); });
        });
        return;
      }
      if (d && d.kind === 'returning') S.kind = 'returning';
      var steps0 = steps();
      S.step = d && d.step && (steps0.indexOf(d.step) >= 0) && S.kind ? d.step : 'start';
      if (S.kind === 'returning' && !S.token) S.step = 'start';
      if (canceled && S.kind === 'new') S.step = 'review';
      if (S.bannerAt && S.bannerAt !== 'review') S.bannerAt = S.step;
      render(false);
    });
  }
  function finish(p, d) {
    if (p.paid) { clearDraft(); S.step = 'already'; return render(); }
    applyFields(p.fields);
    if (empty(S.f.first) && p.name) { var parts = String(p.name).trim().split(/\s+/); S.f.first = parts.shift() || ''; S.f.last = parts.join(' '); }
    if (!d) { S.banner = p.fields ? 'We filled in what we have from your ' + esc(p.source || 'last registration') + '. Please check each screen and fix anything that has changed.' : ''; S.bannerAt = 'interest'; }
    var l = steps(), canc = new URLSearchParams(location.search).get('canceled') === '1' && d;
    S.step = canc ? 'review' : (d && d.step && l.indexOf(d.step) >= 0 ? d.step : 'interest');
    if (d && !canc) S.bannerAt = S.step;
    render(false);
  }
  start();
})();
</script>
</div>
