<!-- ============================================================
     MTFOA Main Menu (desktop AND phone)
     One header menu that matches the rest of the site: Barlow Condensed
     type, the site navy and red, the red-star logo, a dropdown for Member
     Roster (Halls of Fame), and a white bar under the page you are on and a red line under the bar. The header section also has its own 3px red bottom border (set in the editor) so the line reaches both screen edges.

       DESKTOP (box wider than 720px): logo and the seven menu items (Member Roster has a
                dropdown; Facebook is only in the footer).
       PHONE  (box narrower): logo and a hamburger button. Tapping it opens
                the same menu as a list; Member Roster has a small
                arrow that opens its sub-page.

     HOW IT WORKS
       * ONE WebsiteBuilder HTML embed in the site header, shown on all pages
         and both layouts.
       * Current page: AppsApi.getCurrentUrl(), matched against MENU below.
       * Dropdown / hamburger list: the embed grows taller while it is open
         (AppsApi.setAppSize) and shrinks back when it closes. The header is a
         fixed layer that does not clip, so it draws over the page.
       * The font is built into this file so the menu does not flash in a
         fallback font, and the bar fades in once it is ready.
       * The links are typed in the MENU list. If you add, rename or move a
         page, edit that list and paste the block back into the embed.

     Box: desktop 960 x 68 (Left 3, the width of the site), phone full width x 64.
   ============================================================ -->

  .mtfoa-menu {
    --mn-navy: #1f3864;
    --mn-navy-deep: #142a4d;
    --mn-red: #d6291a;
    --mn-white: #ffffff;
    --mn-tint: #c9d6e8;
    --mn-chalk: #f4f6fa;
    --mn-ink: #1c2530;
    --mn-cond: 'MN Barlow Condensed', 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
    font-family: 'Barlow', Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative; width: 100%;
  }
  .mtfoa-menu, .mtfoa-menu * { box-sizing: border-box; }
  .mtfoa-menu :where(ul, li, p) { margin: 0; padding: 0; list-style: none; }
  .mtfoa-menu a { text-decoration: none; color: inherit; }
  .mtfoa-menu :where(button) { font: inherit; color: inherit; }
  .mtfoa-menu a:focus-visible, .mtfoa-menu button:focus-visible { outline: 3px solid var(--mn-red); outline-offset: -3px; }

  /* the bar is solid navy from the first paint; its contents fade in when ready */
  .mn-bar {
    position: relative; z-index: 2; height: 68px; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--mn-navy); padding: 0 24px 3px 24px;
  }
  .mn-bar::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--mn-red); }
  .mn-in { display: contents; }
  .mn-bar > .mn-in > * { opacity: 0; transition: opacity 0.14s ease; }
  .ready .mn-bar > .mn-in > * { opacity: 1; }
  .mn-logo { flex: none; display: block; height: 54px; }
  .mn-logo img { display: block; height: 54px; width: auto; }

  /* ---------------- desktop ---------------- */
  .mn-list { flex: 1 1 auto; display: flex; justify-content: center; align-items: stretch; height: 65px; gap: 0; min-width: 0; }
  .mn-item { position: relative; display: flex; align-items: stretch; flex: none; }
  .mn-link {
    position: relative; display: flex; align-items: center; gap: 6px;
    padding: 0 var(--mn-pad, 7px); height: 65px; cursor: pointer;
    font-family: var(--mn-cond); font-weight: 600; font-size: 16px;
    letter-spacing: 0.8px; text-transform: uppercase; white-space: nowrap; color: var(--mn-white);
    background: none; border: 0; transition: color 0.15s ease;
  }
  .mn-link::after {
    content: ''; position: absolute; left: var(--mn-pad, 7px); right: var(--mn-pad, 7px); bottom: 0; height: 3px;
    background: var(--mn-white); transform: scaleX(0); transform-origin: left; transition: transform 0.18s ease;
  }
  .mn-item:hover > .mn-link::after, .mn-item.open > .mn-link::after, .mn-item.on > .mn-link::after { transform: scaleX(1); }
  .mn-item.on > .mn-link { color: var(--mn-white); }
  .mn-item:not(.on) > .mn-link { color: var(--mn-tint); }
  .mn-item:hover > .mn-link, .mn-item.open > .mn-link { color: var(--mn-white); }
  .mn-caret { width: 9px; height: 9px; flex: none; margin-top: 1px; transition: transform 0.18s ease; }
  .mn-item.open .mn-caret { transform: rotate(180deg); }

  .mn-panel {
    position: absolute; top: 68px; left: 0; min-width: 260px; z-index: 1;
    background: var(--mn-white);
    border-radius: 0 0 6px 6px; box-shadow: 0 16px 32px rgba(20, 42, 77, 0.28);
    padding: 6px 0; opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s;
  }
  .mn-item:last-child > .mn-panel { left: auto; right: 0; }
  .mn-item.open > .mn-panel { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .mn-panel a {
    display: block; padding: 12px 20px 12px 17px; border-left: 4px solid transparent;
    font-weight: 600; font-size: 16px; line-height: 1.25; color: var(--mn-navy);
  }
  .mn-panel a:hover { background: var(--mn-chalk); border-left-color: var(--mn-red); }
  .mn-panel a.on { color: var(--mn-red); border-left-color: var(--mn-red); }
  .mn-panel a small { display: block; margin-top: 1px; font-weight: 400; font-size: 13.5px; color: #5b6879; }
  .mn-panel .mn-over { display: none; }
  .touch .mn-panel .mn-over { display: block; }

  /* ---------------- phone ---------------- */
  .m .mn-bar { height: 64px; padding: 0 12px 3px 16px; gap: 8px; }
  .m .mn-logo, .m .mn-logo img { height: 46px; }
  .mm-btn {
    flex: none; width: 48px; height: 48px; border: 0; border-radius: 8px; background: transparent; cursor: pointer;
    display: grid; place-items: center; color: var(--mn-white);
  }
  .mm-btn span { display: block; width: 26px; height: 3px; border-radius: 2px; background: currentColor; transition: transform 0.2s ease, opacity 0.15s ease; }
  .mm-btn span + span { margin-top: 5px; }
  .mm-open .mm-btn span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .mm-open .mm-btn span:nth-child(2) { opacity: 0; }
  .mm-open .mm-btn span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
  .mm-inner { display: block; }
  .mm-panel {
    position: absolute; top: 64px; left: 0; right: 0; z-index: 1; display: none;
    background: var(--mn-navy-deep); overflow-y: auto; -webkit-overflow-scrolling: touch;
    box-shadow: 0 18px 30px rgba(20, 42, 77, 0.35);
  }
  .mm-open .mm-panel { display: block; }
  .mm-row { display: flex; align-items: stretch; border-bottom: 1px solid rgba(201, 214, 232, 0.14); }
  .mm-row > a {
    flex: 1 1 auto; display: flex; align-items: center; min-height: 52px; padding: 0 18px 0 20px;
    font-family: var(--mn-cond); font-weight: 600; font-size: 20px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--mn-tint);
    border-left: 5px solid transparent;
  }
  .mm-row.on > a { color: var(--mn-white); border-left-color: var(--mn-red); }
  .mm-tog { flex: none; width: 56px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--mn-tint); border-left: 1px solid rgba(201, 214, 232, 0.14); }
  .mm-tog svg { width: 14px; height: 14px; transition: transform 0.18s ease; }
  .mm-item.sub-open .mm-tog svg { transform: rotate(180deg); }
  .mm-sub { display: none; background: rgba(0, 0, 0, 0.16); }
  .mm-item.sub-open .mm-sub { display: block; }

<script>
(function () {
  /* ---- The menu. Edit here when a page is added, renamed or moved. ---- */
  var SITE = 'https://mtfoa.org';
  var MENU = [
    { label: 'News & Info',    href: '/news' },
    { label: 'Member Roster',  href: '/members', also: ['/halls-of-fame'],
      kids: [ { label: 'Halls of Fame', href: '/halls-of-fame' } ] },
    { label: 'Education',      href: '/education' },
    { label: 'Photo Albums',   href: '/photos' },
    { label: 'MTFOA Store',    href: '/mtfoa-store' },
    { label: 'Helpful Links',  href: '/helpful-links' },
    { label: 'Member Portal',  href: '/mtfoamembers', also: ['/member-resources', '/evaluate-and-observe'] }
  ];

  var root = document.getElementById('mnRoot');
  var inner = document.getElementById('mnIn');
  /* 720px is just a fast first guess, before anything is actually measured. If desktop turns out to
     really crowd the logo or run off the edge once it's built (see fit() below), that's corrected by
     swapping to the phone menu in place — real fit, not a fixed number, decides the switch. */
  var MOBILE = (window.innerWidth || 960) < 720;
  var BAR_H = MOBILE ? 64 : 68;
  var isTouch = false;
  try { isTouch = window.matchMedia('(hover: none)').matches; } catch (e) {}
  if (isTouch) root.classList.add('touch');
  if (MOBILE) root.classList.add('m');

  /* ---- which page are we on? ---- */
  function currentUrl() {
    var u = '';
    try { u = (window.AppsApi && AppsApi.getCurrentUrl && AppsApi.getCurrentUrl()) || ''; } catch (e) {}
    if (!u) {
      try {
        var enc = new URLSearchParams(location.search).get('wzEncodeParams');
        if (enc) u = JSON.parse(atob(enc.replace(/-/g, '+').replace(/_/g, '/'))).wzCurrentUrl || '';
      } catch (e) {}
    }
    if (!u) { try { u = location.href; } catch (e) {} }   // plain static hosting: no WebsiteBuilder AppsApi/wzEncodeParams
    return String(u);
  }
  function here() {
    var m = currentUrl().match(/^https?:\/\/[^\/]+([^?#]*)(#[^?]*)?/i);
    var p = m ? m[1] : '/';
    if ((!p || p === '/') && m && m[2]) { var segs = m[2].split('/'); p = '/' + segs[segs.length - 1]; }
    p = String(p).toLowerCase().replace(/\/+$/, '');
    return p || '/';
  }
  var path = here();
  function pathsOf(it) { return [it.href].concat(it.also || []).concat((it.kids || []).map(function (k) { return k.href; })); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function resize(h) {
    try {
      if (window.AppsApi && AppsApi.setAppSize && AppsApi.getViewMode && AppsApi.getViewMode() !== 'designer') {
        AppsApi.setAppSize({ width: window.innerWidth || 960, height: h });
      }
    } catch (e) {}
  }
  var CARET = '<svg class="mn-caret" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5"/></svg>';

  if (!MOBILE) buildDesktop(); else buildPhone();

  /* If the window is later made bigger again — after the demotion above, or just starting narrow and
     growing — try the desktop menu again once there is plausibly enough room. buildDesktop()'s own
     checkFit() immediately bounces back to the phone menu if it turns out it still doesn't really fit,
     so this can't get stuck showing a crowded desktop menu either. */
  var mnPromoteTimer;
  window.addEventListener('resize', function () {
    if (!MOBILE) return;   // desktop's own resize watcher (inside buildDesktop) handles shrinking back down
    clearTimeout(mnPromoteTimer);
    mnPromoteTimer = setTimeout(function () {
      if (!MOBILE || (window.innerWidth || 960) < 720) return;
      var btn = inner.querySelector('.mm-btn'); if (btn) btn.remove();
      var panel = root.querySelector('.mm-panel'); if (panel) panel.remove();
      root.classList.remove('m');
      MOBILE = false; BAR_H = 68;
      buildDesktop();
    }, 150);
  });

  /* fade the contents in once the built-in font is ready */
  function ready() { root.classList.add('ready'); }
  try { document.fonts.load("600 16px 'MN Barlow Condensed'").then(ready, ready); } catch (e) { ready(); }
  setTimeout(ready, 400);

  /* =============================== desktop =============================== */
  function buildDesktop() {
    var ul = document.createElement('ul'); ul.className = 'mn-list'; ul.id = 'mnList';
    MENU.forEach(function (it) {
      var kids = it.kids || [];
      var on = pathsOf(it).indexOf(path) !== -1;
      var li = document.createElement('li');
      li.className = 'mn-item' + (on ? ' on' : '') + (kids.length ? ' has-kids' : '');
      var html = '<a class="mn-link" href="' + SITE + it.href + '" target="_top">' + esc(it.label) + (kids.length ? CARET : '') + '</a>';
      if (kids.length) {
        html += '<div class="mn-panel"><a class="mn-over" href="' + SITE + it.href + '" target="_top">' + esc(it.label) + '</a>';
        kids.forEach(function (k) {
          html += '<a href="' + SITE + k.href + '" target="_top"' + (k.href === path ? ' class="on"' : '') + '>' + esc(k.label) + (k.note ? '<small>' + esc(k.note) + '</small>' : '') + '</a>';
        });
        html += '</div>';
      }
      li.innerHTML = html; ul.appendChild(li);
    });
    inner.appendChild(ul);

    // Never let the items touch the logo or the Facebook icon: if they do not fit, tighten the spacing a little.
    // If they still do not fit once the spacing is as tight as it goes, this is not really a desktop-width
    // window (a narrow one, a shrunk one, a tall phone in landscape) — switch to the phone menu instead of
    // letting "MEMBER ROSTER" or "MEMBER PORTAL" crowd the logo or run off the edge.
    function fit() {
      var pad = 7;
      ul.style.setProperty('--mn-pad', pad + 'px');
      function need() { var n = 0; for (var i = 0; i < ul.children.length; i++) n += ul.children[i].offsetWidth; return n; }
      while (need() > ul.clientWidth - 24 && pad > 3) { pad -= 1; ul.style.setProperty('--mn-pad', pad + 'px'); }
      return need() > ul.clientWidth - 24;
    }
    // If it still does not fit even at minimum spacing, swap to the phone menu in this same spot — done at
    // most once; after that this whole desktop build is torn down, so there is nothing left here to re-check.
    var demoted = false;
    function checkFit() {
      if (demoted || fit() === false) return;
      demoted = true;
      window.removeEventListener('resize', onFitResize);
      ul.remove();
      MOBILE = true;
      root.classList.add('m');
      BAR_H = 64;
      buildPhone();
    }
    checkFit();
    try { document.fonts.ready.then(checkFit); } catch (e) {}
    setTimeout(checkFit, 500);
    var mnFitResizeTimer;
    function onFitResize() {
      clearTimeout(mnFitResizeTimer);
      mnFitResizeTimer = setTimeout(checkFit, 150);
    }
    window.addEventListener('resize', onFitResize);

    // Grow once to fit the tallest dropdown and stay that size until every dropdown is closed,
    // so opening and closing the dropdown never resizes the box (that caused flicker).
    var maxH = BAR_H, expanded = false, openItem = null, timer = null;
    Array.prototype.forEach.call(ul.querySelectorAll('.mn-panel'), function (p) { maxH = Math.max(maxH, BAR_H + p.offsetHeight + 24); });
    function open(li) {
      clearTimeout(timer);
      if (openItem && openItem !== li) openItem.classList.remove('open');
      openItem = li;
      if (!expanded) { expanded = true; resize(maxH); }
      // wait a frame so the taller box exists before the panel fades in
      setTimeout(function () { if (openItem === li) li.classList.add('open'); }, 30);
    }
    function closeSoon() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (openItem) openItem.classList.remove('open');
        openItem = null;
        setTimeout(function () { if (!openItem && expanded) { expanded = false; resize(BAR_H); } }, 180);   // let the fade-out finish first
      }, 160);
    }
    Array.prototype.forEach.call(ul.querySelectorAll('.has-kids'), function (li) {
      li.addEventListener('mouseenter', function () { if (!isTouch) open(li); });
      li.addEventListener('mouseleave', function () { if (!isTouch) closeSoon(); });
      li.addEventListener('focusin', function () { open(li); });
      li.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeSoon(); });
      if (isTouch) {
        li.querySelector('.mn-link').addEventListener('click', function (ev) { if (openItem !== li) { ev.preventDefault(); open(li); } });
      }
    });
    // Safety nets: some browsers do not report the pointer leaving the box.
    document.documentElement.addEventListener('mouseleave', closeSoon);
    document.addEventListener('mouseout', function (ev) { if (!ev.relatedTarget) closeSoon(); });
    document.addEventListener('click', function (ev) { if (openItem && !openItem.contains(ev.target)) closeSoon(); });
    setInterval(function () {
      if (expanded && !isTouch && !ul.querySelector('.mn-item:hover')) closeSoon();
    }, 400);
  }

  /* ================================ phone ================================ */
  function buildPhone() {
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'mm-btn'; btn.setAttribute('aria-label', 'Open the menu'); btn.setAttribute('aria-expanded', 'false');
    btn.innerHTML = '<div class="mm-inner"><span></span><span></span><span></span></div>';
    inner.appendChild(btn);

    var panel = document.createElement('div'); panel.className = 'mm-panel'; panel.id = 'mmPanel';
    var html = '';
    MENU.forEach(function (it, i) {
      var kids = it.kids || [];
      var on = pathsOf(it).indexOf(path) !== -1;
      html += '<div class="mm-item' + (on && kids.length ? ' sub-open' : '') + '"><div class="mm-row' + (on ? ' on' : '') + '"><a href="' + SITE + it.href + '" target="_top">' + esc(it.label) + '</a>' +
              (kids.length ? '<button type="button" class="mm-tog" aria-label="Show ' + esc(it.label) + ' pages">' + CARET.replace('mn-caret', '') + '</button>' : '') + '</div>';
      if (kids.length) {
        html += '<div class="mm-sub">';
        kids.forEach(function (k) {
          html += '<a href="' + SITE + k.href + '" target="_top"' + (k.href === path ? ' class="on"' : '') + '>' + esc(k.label) + (k.note ? '<small>' + esc(k.note) + '</small>' : '') + '</a>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    panel.innerHTML = html;
    root.appendChild(panel);

    var isOpen = false;
    function panelHeight() {
      var want = panel.scrollHeight;
      var cap = Math.max(260, Math.round((window.screen && screen.height ? screen.height : 700) * 0.82) - BAR_H);
      var h = Math.min(want, cap);
      panel.style.maxHeight = h + 'px';
      return h;
    }
    function setOpen(v) {
      isOpen = v;
      root.classList.toggle('mm-open', v);
      btn.setAttribute('aria-expanded', v ? 'true' : 'false');
      btn.setAttribute('aria-label', v ? 'Close the menu' : 'Open the menu');
      if (v) resize(BAR_H + panelHeight() + 3); else resize(BAR_H);
    }
    btn.addEventListener('click', function () { setOpen(!isOpen); });
    panel.addEventListener('click', function (ev) {
      var t = ev.target.closest ? ev.target.closest('.mm-tog') : null;
      if (!t) return;
      var item = t.closest('.mm-item'); item.classList.toggle('sub-open');
      if (isOpen) resize(BAR_H + panelHeight() + 3);
    });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && isOpen) setOpen(false); });
  }
})();
</script>
